name: sync upstream into pages

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pages branch
        uses: actions/checkout@v7
        with:
          ref: pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync fork main with upstream main
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          # main 作为 upstream 镜像：直接在远端对齐，本地从不检出 main
          git fetch origin main 2>/dev/null || true
          if git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            git push origin "upstream/main:main" \
              --force-with-lease="refs/heads/main:$(git rev-parse refs/remotes/origin/main)"
          else
            echo "fork 尚无 main 分支，首次创建"
            git push origin "upstream/main:main"
          fi

      - name: Guard - stop if upstream deleted _worker.js
        run: |
          # 以 pages（当前 HEAD）作为"以前存在过"的依据
          if git cat-file -e upstream/main:_worker.js 2>/dev/null; then
            echo "_worker.js still exists upstream, continue"
          elif git cat-file -e HEAD:_worker.js 2>/dev/null; then
            echo "::error::Upstream deleted _worker.js. Sync stopped, pages branch untouched."
            exit 1
          else
            echo "::warning::_worker.js never existed, continuing."
          fi

               
      - name: Purge Cloudflare Pages deployments
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -uo pipefail
          # 一次性装好，后续复用缓存，避免每次 npx 都重新拉
          npm install -g wrangler@latest >/dev/null 2>&1 || true
          export PATH="$PATH:$(npm bin -g 2>/dev/null || echo /usr/local/bin)"

          # 先做一次自检：项目不存在就立刻退出并打印可用的项目列表
          if ! wrangler pages project list 2>/dev/null | grep -q "^│.*${CF_PROJECT}"; then
            echo "::error::Project '${CF_PROJECT}' not found in account ${CLOUDFLARE_ACCOUNT_ID}"
            echo "::group::Available pages projects"
            wrangler pages project list || true
            echo "::endgroup::"
            exit 1
          fi

          prod_id=""
          while :; do
            # 兼容 wrangler 不同版本的 JSON 结构
            ids=$(wrangler pages deployment list \
                    --project-name "$CF_PROJECT" --json \
                  | jq -r '
                      if type == "array" then .[]?.id
                      elif .result then .result[]?.id
                      else empty end // empty' | sort -u)

            to_delete=$(printf '%s\n' "$ids" | grep -v -F -x "$prod_id" | grep . || true)
            [ -z "$to_delete" ] && { echo "Done. Kept production: $prod_id"; break; }

            echo "Deleting $(printf '%s\n' "$to_delete" | wc -l | tr -d ' ') deployments..."
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              wrangler pages deployment delete "$id" \
                  --project-name "$CF_PROJECT" --force \
                  > /tmp/wrangler-del.log 2>&1
              case "$(cat /tmp/wrangler-del.log)" in
                *"Successfully deleted"*) echo "  ✓ $id" ;;
                *"active production deployment"*)
                  echo "  ⤼ skip production: $id"
                  prod_id="$id" ;;
                *) echo "  ✗ $id"; sed 's/^/      /' /tmp/wrangler-del.log | head -5 ;;
              esac
              sleep 1
            done <<< "$to_delete"
          done


      - name: Merge upstream/main into pages
        run: |
          # HEAD 全程停留在 pages；upstream/main 与刚推送的 main 指向同一提交，合并结果等价
          if git merge upstream/main -X ours --no-edit; then
            git push origin pages
          else
            echo "::error::Merge failed. Manual resolution needed."
            exit 1
          fi

      - name: Delete past completed runs
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --limit 100 \
            --json databaseId,status \
            --jq '.[] | select(.status=="completed") | .databaseId' | while read -r run_id; do
              if [ -z "$run_id" ]; then continue; fi
              if [ "$run_id" = "${{ github.run_id }}" ]; then continue; fi
              gh run delete "$run_id" --repo "${{ github.repository }}" || true
            done
