name: sync upstream into pages

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pages branch
        uses: actions/checkout@v7
        with:
          ref: pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync fork main with upstream main
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          # main 作为 upstream 镜像：直接在远端对齐，本地从不检出 main
          git fetch origin main 2>/dev/null || true
          if git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            git push origin "upstream/main:main" \
              --force-with-lease="refs/heads/main:$(git rev-parse refs/remotes/origin/main)"
          else
            echo "fork 尚无 main 分支，首次创建"
            git push origin "upstream/main:main"
          fi

      - name: Guard - stop if upstream deleted _worker.js
        run: |
          # 以 pages（当前 HEAD）作为"以前存在过"的依据
          if git cat-file -e upstream/main:_worker.js 2>/dev/null; then
            echo "_worker.js still exists upstream, continue"
          elif git cat-file -e HEAD:_worker.js 2>/dev/null; then
            echo "::error::Upstream deleted _worker.js. Sync stopped, pages branch untouched."
            exit 1
          else
            echo "::warning::_worker.js never existed, continuing."
          fi
               
      - name: Cleanup Cloudflare Pages Deployments
        uses: Th3S4mur41/cleanup-cloudflare-deployments@v2.0.0
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project-name: ${{ secrets.CLOUDFLARE_PAGE_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cleanup-types: all
          preview-keep: 1
          production-keep: 1
          dry-run: 'false'

      - name: Merge upstream/main into pages
        run: |
          # HEAD 全程停留在 pages；upstream/main 与刚推送的 main 指向同一提交，合并结果等价
          if git merge upstream/main -X ours --no-edit; then
            git push origin pages
          else
            echo "::error::Merge failed. Manual resolution needed."
            exit 1
          fi

      - name: Delete past completed runs
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --limit 100 \
            --json databaseId,status \
            --jq '.[] | select(.status=="completed") | .databaseId' | while read -r run_id; do
              if [ -z "$run_id" ]; then continue; fi
              if [ "$run_id" = "${{ github.run_id }}" ]; then continue; fi
              gh run delete "$run_id" --repo "${{ github.repository }}" || true
            done
