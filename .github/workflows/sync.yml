name: sync upstream into pages

on:
  schedule:
    - cron: "37 9 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pages branch
        uses: actions/checkout@v4
        with:
          ref: pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main with upstream
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          if git cat-file -e origin/main:_worker.js 2>/dev/null; then
            echo "WORKJS_HAD_BEFORE=true" >> "$GITHUB_ENV"
          else
            echo "WORKJS_HAD_BEFORE=false" >> "$GITHUB_ENV"
          fi

          git checkout main
          if git merge --ff-only upstream/main; then
            echo "main fast-forwarded or already up to date"
            git push origin main
          else
            echo "main diverged, force reset to upstream"
            git reset --hard upstream/main
            git push origin main --force-with-lease
          fi

      - name: Guard - stop if upstream deleted _worker.js
        run: |
          if git cat-file -e upstream/main:_worker.js 2>/dev/null; then
            echo "_worker.js still exists upstream, continue"
          elif [ "$WORKJS_HAD_BEFORE" = "true" ]; then
            echo "::error::Upstream deleted _worker.js. Sync stopped, pages branch untouched."
            exit 1
          else
            echo "::warning::_worker.js never existed upstream, continuing."
          fi

      - name: Merge main into pages
        run: |
          git checkout pages
          if ! git merge main -X ours --no-edit; then
            echo "::error::Merge failed. Manual resolution needed."
            exit 1
          fi
          git push origin pages

      - name: Delete past completed runs
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --limit 100 \
            --json databaseId,status \
            --jq '.[] | select(.status=="completed") | .databaseId' | while read -r run_id; do
              if [ -z "$run_id" ]; then continue; fi
              if [ "$run_id" = "${{ github.run_id }}" ]; then continue; fi
              gh run delete "$run_id" --repo "${{ github.repository }}" || true
            done
